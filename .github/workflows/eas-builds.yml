name: EAS builds for businesses

on:
  workflow_dispatch:
  push:
    branches:
      - feature/add-creador-de-apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create credentials folder and write Firebase key (if provided)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 != '' }}
        run: |
          mkdir -p SistemaRestaurante/credentials
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}" | base64 --decode > SistemaRestaurante/credentials/google-service-account.json
          ls -la SistemaRestaurante/credentials
        shell: bash

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          cd SistemaRestaurante
          npm ci

      - name: Verify Firebase credential exists (optional)
        run: |
          if [ -f SistemaRestaurante/credentials/google-service-account.json ]; then
            echo "Firebase credential found:" $(node -e "console.log(require('./SistemaRestaurante/credentials/google-service-account.json').project_id)")
          else
            echo "No Firebase credential provided via FIREBASE_SERVICE_ACCOUNT_BASE64 secret"
          fi
        shell: bash

      - name: Run builds via script
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd SistemaRestaurante
          # Non-interactive eas calls rely on EXPO_TOKEN being set
          node scripts/build-by-business.js
